## =====================================================================
##  WIND STUDIO - Base Militaire V2
##  Documentation : https://wind-studio-1.gitbook.io/wind-studio-docs/
##
##  Les lignes à modifier sont précédées de  ## >>> À MODIFIER
## =====================================================================

## ---------- Réseau ----------
## Port du serveur (changez-le si votre hébergeur vous en impose un)
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## ---------- Informations du serveur ----------
## >>> À MODIFIER
sv_hostname "Wind Studio Military Base"
sets sv_projectName "Wind Studio Military Base"
sets sv_projectDesc "Description de votre serveur"
sets tags "rp, roleplay, militaire, fr"
sets locale "fr-FR"

## Nombre de places
sv_maxclients 48

## Clé de licence : https://portal.cfx.re/servers/registration-keys
## Elle doit être générée sur le compte Cfx qui possède les scripts Wind Studio.
## >>> À MODIFIER
sv_licenseKey "VOTRE_CLE_DE_LICENCE"

## Clé API Steam (facultatif) : https://steamcommunity.com/dev/apikey
set steam_webApiKey ""

## ---------- Base de données ----------
## Format : mysql://UTILISATEUR:MOT_DE_PASSE@HOTE:PORT/NOM_DE_LA_BASE
## >>> À MODIFIER
set mysql_connection_string "mysql://UTILISATEUR:MOT_DE_PASSE@localhost:3306/NOM_DE_LA_BASE?charset=utf8mb4"
set mysql_ui true
set mysql_slow_query_warning 500

## ---------- Jeu et sécurité ----------
## Build requis par les mappings, ne pas descendre en dessous
sv_enforceGameBuild 3570
set resources_useSystemChat true
sv_scriptHookAllowed 0
set sv_requestParanoia 3
sv_endpointPrivacy true

## ---------- ESX ----------
setr esx:locale "fr"

## ---------- ox_lib ----------
setr ox:locale "fr"
set ox:ignoreSecurityAdvisory ["stateBagStrictMode"]

## ---------- ox_inventory ----------
setr inventory:framework "esx"
setr inventory:slots 50
setr inventory:weight 48000

## ---------- illenium-appearance ----------
setr illenium-appearance:locale "fr"

## ---------- pma-voice ----------
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true

